<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="card__images">
      <img src="assets/image-equilibrium.jpg" alt="Equilibrium NFT" class="card__image">
      <div class="card__images-layer">
        <img src="assets/icon-view.svg" alt="View icon">
      </div>
    </div>
<div class="card__title"><h1>Equilibrium #3429</h1></div>
    
    <p class="card__description">
      Our Equilibrium collection promotes balance and calm.
    </p>

    <div class="card__time">
      <div class="card__time-left">
        <img src="assets/icon-ethereum.svg" alt="Ethereum icon">
        <span>0.041 ETH</span>
      </div>
      <div class="card__time-right">
        <img src="assets/icon-clock.svg" alt="Clock icon">
        <span>3 days left</span>
      </div>
    </div>

    <div class="card__creator">
      <img src="assets/icon-view.svg" alt="Creator avatar">
      <p>Creation of <span class="creator-name">Jules Wyvern</span></p>
    </div>
  </main>

  <footer class="attribution">
    <p>
      Challenge by <a href="https://www.crio.do" target="_blank">Crio</a>.
      Coded by <a href="https://github.com/Nagarajumv99/xnft_preview_card.git" target="_blank">Nagaraju M V</a>.
    </p>
  </footer> 
</body>
</html>
